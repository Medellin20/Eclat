[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_PAYPAL_ME_PROFILE = "EvelyneLubinskyajoute"
  # À compléter avec le lien du bouton « Vérifier ma commande »
  NEXT_PUBLIC_STEAM_VERIFICATION_URL = ""

# Le plugin officiel Next.js gère le routage App Router,
# les routes API et le rendu à la demande sur Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"
